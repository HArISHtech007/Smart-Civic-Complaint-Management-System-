<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Complaint — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; }
    .timeline { position: relative; padding-left: 40px; }
    .timeline::before { content: ''; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; background: var(--border-subtle); }
    .timeline-item { position: relative; padding-bottom: 32px; }
    .timeline-dot { position: absolute; left: -40px; top: 4px; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--text-muted); background: var(--bg-card); display: flex; align-items: center; justify-content: center; z-index: 1; }
    .timeline-dot.active { border-color: var(--primary-blue); background: rgba(59,130,246,0.15); }
    .timeline-dot.completed { border-color: var(--success-green); background: rgba(16,185,129,0.15); }
    #detailMap { height: 250px; border-radius: var(--radius-md); }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px; max-width: 900px;">
        <a href="dashboard.html" style="display: flex; align-items: center; gap: 4px; color: var(--text-tertiary); font-size: 0.85rem; margin-bottom: 24px;">
          <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
          Back to Dashboard
        </a>
        <div id="complaintDetail" style="display: flex; flex-direction: column; gap: 24px;">
          <div class="card" style="padding: 32px;">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
              <div>
                <p class="mono" style="color: var(--text-tertiary); font-size: 0.85rem; margin-bottom: 4px;" id="complaintId">Loading...</p>
                <h1 style="font-size: 1.5rem; font-weight: 700;" id="complaintTitle">--</h1>
              </div>
              <div style="display: flex; gap: 8px;">
                <span class="badge" id="statusBadge" style="padding: 4px 14px;">--</span>
                <span class="badge" id="severityBadge" style="padding: 4px 14px;">--</span>
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
              <div><span style="color: var(--text-tertiary); font-size: 0.8rem;">Category</span><p style="font-weight: 500;" id="complaintCategory">--</p></div>
              <div><span style="color: var(--text-tertiary); font-size: 0.8rem;">Department</span><p style="font-weight: 500;" id="complaintDept">--</p></div>
              <div><span style="color: var(--text-tertiary); font-size: 0.8rem;">Location</span><p style="font-weight: 500;" id="complaintLocation">--</p></div>
              <div><span style="color: var(--text-tertiary); font-size: 0.8rem;">Date</span><p style="font-weight: 500;" id="complaintDate">--</p></div>
            </div>
            <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7;" id="complaintDescription">--</p>
          </div>

          <div class="card" style="padding: 32px;">
            <h3 style="font-weight: 600; margin-bottom: 24px;">Status Timeline</h3>
            <div class="timeline" id="timelineContainer"></div>
          </div>

          <div class="card" style="padding: 32px;">
            <h3 style="font-weight: 600; margin-bottom: 16px;">Location</h3>
            <div id="detailMap"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/complaint.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadComplaint() {
      const id = getQueryParam('id');
      if (!id) { document.getElementById('complaintId').textContent = 'No complaint ID provided'; return; }
      try {
        const data = await getComplaintById(id);
        const c = data.complaint || data.data || data;
        renderComplaint(c);
      } catch (err) {
        renderMockComplaint(id);
      }
    }

    function renderComplaint(c) {
      const status = getStatusConfig(c.status);
      const severity = getSeverityConfig(c.severity);
      document.getElementById('complaintId').textContent = `ID: ${c._id || c.id || '--'}`;
      document.getElementById('complaintTitle').textContent = c.title || 'Complaint';
      document.getElementById('statusBadge').textContent = status.label;
      document.getElementById('statusBadge').style.cssText = `background: ${status.color}20; color: ${status.color}; padding: 4px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 600;`;
      document.getElementById('severityBadge').textContent = severity.label;
      document.getElementById('severityBadge').style.cssText = `background: ${severity.color}20; color: ${severity.color}; padding: 4px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 600;`;
      document.getElementById('complaintCategory').textContent = c.category || 'General';
      document.getElementById('complaintDept').textContent = c.department || 'Not assigned';
      document.getElementById('complaintLocation').textContent = c.location?.address || c.location || '--';
      document.getElementById('complaintDate').textContent = formatDate(c.createdAt);
      document.getElementById('complaintDescription').textContent = c.description || 'No description provided.';
      renderTimeline(c.status, c.timeline || []);
      if (c.lat && c.lng) initDetailMap(c.lat, c.lng);
      else initDetailMap(13.0827, 80.2707);
    }

    function renderMockComplaint(id) {
      document.getElementById('complaintId').textContent = `ID: ${id}`;
      document.getElementById('complaintTitle').textContent = 'Pothole on Main Road';
      document.getElementById('statusBadge').textContent = 'In Progress';
      document.getElementById('statusBadge').style.cssText = 'background: rgba(139,92,246,0.15); color: #8B5CF6; padding: 4px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 600;';
      document.getElementById('severityBadge').textContent = 'High';
      document.getElementById('severityBadge').style.cssText = 'background: rgba(245,158,11,0.15); color: #F59E0B; padding: 4px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 600;';
      document.getElementById('complaintCategory').textContent = 'Pothole';
      document.getElementById('complaintDept').textContent = 'Roads & Highways';
      document.getElementById('complaintLocation').textContent = 'Anna Nagar, Chennai';
      document.getElementById('complaintDate').textContent = '24 Jul 2026';
      document.getElementById('complaintDescription').textContent = 'Large pothole near the junction causing traffic hazards. Multiple vehicles have reported damage. Needs immediate attention.';
      renderTimeline('in_progress', [
        { status: 'submitted', timestamp: '2026-07-24T08:30:00' },
        { status: 'under_review', timestamp: '2026-07-24T09:15:00' },
        { status: 'assigned', timestamp: '2026-07-24T10:00:00' },
        { status: 'in_progress', timestamp: '2026-07-24T11:30:00' }
      ]);
      initDetailMap(13.0827, 80.2707);
    }

    function renderTimeline(currentStatus, timelineEvents) {
      const container = document.getElementById('timelineContainer');
      const allStatuses = STATUS_FLOW;
      const currentIdx = getStatusIndex(currentStatus);
      container.innerHTML = allStatuses.map((s, i) => {
        const cfg = getStatusConfig(s);
        const isCompleted = i < currentIdx;
        const isActive = i === currentIdx;
        const event = timelineEvents?.find(e => e.status === s);
        const cls = isCompleted ? 'completed' : isActive ? 'active' : '';
        const icon = isCompleted ? 'check' : isActive ? 'hourglass_empty' : 'circle';
        return `<div class="timeline-item">
          <div class="timeline-dot ${cls}">
            <span class="material-symbols-outlined" style="font-size: 16px; color: ${isCompleted ? 'var(--success-green)' : isActive ? 'var(--primary-blue)' : 'var(--text-muted)'};">${icon}</span>
          </div>
          <p style="font-weight: 500; font-size: 0.9rem; color: ${isCompleted || isActive ? 'var(--text-primary)' : 'var(--text-tertiary)'};">${cfg.label}</p>
          <p style="font-size: 0.8rem; color: var(--text-muted);">${event ? formatDateTime(event.timestamp) : isActive ? 'Currently active' : ''}</p>
        </div>`;
      }).join('');
    }

    let detailMap = null;
    function initDetailMap(lat, lng) {
      if (!detailMap) {
        detailMap = L.map('detailMap').setView([lat, lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(detailMap);
      } else { detailMap.setView([lat, lng], 14); }
      L.circleMarker([lat, lng], { radius: 10, fillColor: '#EF4444', color: '#fff', weight: 3, fillOpacity: 0.8 }).addTo(detailMap);
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('track');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Track Complaint');
      loadComplaint();
    });
  </script>
</body>
</html>
