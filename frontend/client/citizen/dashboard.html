<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Dashboard — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; }
    .complaint-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 40px; text-align: center; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .sidebar.open { transform: translateX(0); } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 700;" id="greeting">Good morning 👋</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">Here's your complaint activity overview</p>
          </div>
          <a href="submit.html" class="btn btn-primary" style="padding: 12px 24px;">
            <span class="material-symbols-outlined">add_circle</span>
            Report New Issue
          </a>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px;">
          <div class="card" style="padding: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
              <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(59,130,246,0.15); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="color: var(--primary-blue);">description</span>
              </div>
              <span style="color: var(--text-secondary); font-size: 0.85rem;">Total Complaints</span>
            </div>
            <p class="stat-number" id="totalComplaints" style="font-size: 1.75rem; font-weight: 800;">--</p>
          </div>
          <div class="card" style="padding: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
              <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(245,158,11,0.15); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="color: var(--warning-amber);">hourglass_empty</span>
              </div>
              <span style="color: var(--text-secondary); font-size: 0.85rem;">Pending</span>
            </div>
            <p class="stat-number" id="pendingCount" style="font-size: 1.75rem; font-weight: 800;">--</p>
          </div>
          <div class="card" style="padding: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
              <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(139,92,246,0.15); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="color: var(--primary-purple);">engineering</span>
              </div>
              <span style="color: var(--text-secondary); font-size: 0.85rem;">In Progress</span>
            </div>
            <p class="stat-number" id="inProgressCount" style="font-size: 1.75rem; font-weight: 800;">--</p>
          </div>
          <div class="card" style="padding: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
              <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(16,185,129,0.15); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="color: var(--success-green);">check_circle</span>
              </div>
              <span style="color: var(--text-secondary); font-size: 0.85rem;">Resolved</span>
            </div>
            <p class="stat-number" id="resolvedCount" style="font-size: 1.75rem; font-weight: 800;">--</p>
          </div>
        </div>

        <div id="complaintsSection">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 1.1rem; font-weight: 600;">My Complaints</h2>
            <div style="display: flex; gap: 8px;">
              <select class="input" style="width: auto; padding: 8px 12px;" id="statusFilter" onchange="loadComplaints()">
                <option value="">All Status</option>
                <option value="submitted">Submitted</option>
                <option value="under_review">Under Review</option>
                <option value="assigned">Assigned</option>
                <option value="in_progress">In Progress</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
          </div>
          <div id="complaintList" class="complaint-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth() || !requireRole('citizen')) {}

    function setGreeting() {
      const h = new Date().getHours();
      const user = getUser();
      const name = user?.name?.split(' ')[0] || 'there';
      let g = 'Good evening';
      if (h < 12) g = 'Good morning';
      else if (h < 17) g = 'Good afternoon';
      document.getElementById('greeting').textContent = `${g}, ${name} 👋`;
    }

    async function loadComplaints() {
      const container = document.getElementById('complaintList');
      container.innerHTML = createLoadingSkeleton(3, 'card');
      try {
        const filter = document.getElementById('statusFilter').value;
        const params = {};
        if (filter) params.status = filter;
        const data = await getMyComplaints(params);
        const complaints = data.complaints || data.data || data || [];
        if (!complaints.length) {
          container.innerHTML = `<div class="empty-state card" style="grid-column: 1/-1;">
            <div style="width: 80px; height: 80px; border-radius: 20px; background: rgba(59,130,246,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
              <span class="material-symbols-outlined" style="font-size: 40px; color: var(--text-muted);">inbox</span>
            </div>
            <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 8px;">No complaints yet</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px;">Be the first to report an issue in your area.</p>
            <a href="submit.html" class="btn btn-primary">Report an Issue</a>
          </div>`;
          return;
        }
        container.innerHTML = complaints.map(c => {
          const status = getStatusConfig(c.status);
          const severity = getSeverityConfig(c.severity);
          const dept = getDepartment(c.department);
          return `<div class="card card-hover" style="padding: 20px; cursor: pointer;" onclick="viewComplaint('${c._id || c.id}')">
            <div style="display: flex; gap: 16px;">
              <div style="width: 80px; height: 80px; border-radius: var(--radius-md); overflow: hidden; flex-shrink: 0; background: var(--bg-secondary);">
                ${c.image ? `<img src="${c.image}" style="width: 100%; height: 100%; object-fit: cover;">` : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;"><span class="material-symbols-outlined" style="color: var(--text-muted);">image</span></div>`}
              </div>
              <div style="flex: 1; min-width: 0;">
                <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                  <span class="badge" style="background: rgba(107,114,128,0.12); color: #6B7280;">${c.category || 'General'}</span>
                  <span class="badge" style="background: var(--severity-bg, rgba(59,130,246,0.12)); color: ${severity.color};">${severity.label}</span>
                  <span class="badge" style="background: rgba(107,114,128,0.12); color: ${status.color};">${status.label}</span>
                </div>
                <h3 style="font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.title || c.description?.substring(0, 60) + '...' || 'Complaint'}</h3>
                <p style="color: var(--text-tertiary); font-size: 0.8rem; display: flex; align-items: center; gap: 4px;">
                  <span class="material-symbols-outlined" style="font-size: 14px;">location_on</span>
                  ${c.location?.address || c.location || 'Location not set'}
                </p>
                <p style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px;">${formatTimeAgo(c.createdAt)}</p>
              </div>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        container.innerHTML = '<div class="card" style="padding: 40px; text-align: center; grid-column: 1/-1;"><p style="color: var(--text-tertiary);">Failed to load complaints. Make sure the backend is running.</p></div>';
      }
    }

    let currentComplaintId = null;
    function viewComplaint(id) { currentComplaintId = id; window.location.href = `track.html?id=${id}`; }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      requireRole('citizen');
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Dashboard');
      setGreeting();
      loadComplaints();
    });
  </script>
</body>
</html>
