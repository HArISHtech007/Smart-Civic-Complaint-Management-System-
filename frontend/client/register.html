<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-visual { background: linear-gradient(135deg, rgba(59,130,246,0.05), rgba(139,92,246,0.05)), var(--bg-primary); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .auth-form { display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--bg-secondary); }
    .auth-card { width: 100%; max-width: 460px; animation: fadeInUp 0.6s ease; }
    .password-meter { height: 4px; border-radius: 2px; margin-top: 8px; transition: all 0.3s; }
    .field-error { color: var(--danger-red); font-size: var(--text-xs); margin-top: 4px; display: block; }
    @media (max-width: 768px) { .auth-split { grid-template-columns: 1fr; } .auth-visual { display: none; } }
  </style>
</head>
<body>
  <div class="auth-split">
    <div class="auth-visual">
      <div style="text-align: center; position: relative; z-index: 1;">
        <div style="width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: var(--shadow-glow-blue);">
          <span class="material-symbols-outlined" style="font-size: 40px; color: white;">how_to_reg</span>
        </div>
        <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px;">Join Civic Voice</h2>
        <p style="color: var(--text-secondary); font-size: 1rem;">Start reporting civic issues in minutes</p>
      </div>
    </div>
    <div class="auth-form">
      <div class="auth-card">
        <div style="margin-bottom: 32px;">
          <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 8px;">Create Account</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">Fill in your details to get started</p>
        </div>
        <form id="registerForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="floating-label-group">
              <input type="text" id="name" class="input" placeholder=" " autocomplete="name">
              <label for="name">Full Name</label>
            </div>
            <div class="floating-label-group">
              <input type="tel" id="phone" class="input" placeholder=" " autocomplete="tel">
              <label for="phone">Phone Number</label>
            </div>
          </div>
          <div class="floating-label-group">
            <input type="email" id="email" class="input" placeholder=" " autocomplete="email">
            <label for="email">Email Address</label>
          </div>
          <div class="floating-label-group">
            <input type="password" id="password" class="input" placeholder=" " autocomplete="new-password">
            <label for="password">Password</label>
            <div class="password-meter" id="meter" style="width: 0%; background: transparent;"></div>
            <span id="strengthLabel" style="font-size: 0.75rem; color: var(--text-tertiary); margin-top: 4px; display: block;"></span>
          </div>
          <div class="floating-label-group">
            <input type="password" id="confirmPassword" class="input" placeholder=" " autocomplete="new-password">
            <label for="confirmPassword">Confirm Password</label>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; margin-bottom: 24px;">
            <input type="checkbox" id="terms" style="accent-color: var(--primary-blue);"> I agree to the Terms of Service and Privacy Policy
          </label>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;" id="registerBtn">
            <span class="material-symbols-outlined">person_add</span>
            Create Account
          </button>
        </form>
        <p style="text-align: center; margin-top: 24px; color: var(--text-tertiary); font-size: 0.85rem;">
          Already have an account? <a href="login.html" style="color: var(--primary-blue); font-weight: 600;">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api/index.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/utils/validation.js"></script>
  <script>
    document.getElementById('password').addEventListener('input', function() {
      const result = getPasswordStrength(this.value);
      const meter = document.getElementById('meter');
      const label = document.getElementById('strengthLabel');
      meter.style.width = result.width;
      meter.style.background = result.color;
      label.textContent = result.label;
      label.style.color = result.color;
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const name = document.getElementById('name');
      const phone = document.getElementById('phone');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const confirmPwd = document.getElementById('confirmPassword');
      const terms = document.getElementById('terms');

      const rules = [
        { input: name, validate: v => v.trim().length >= 2, message: 'Name must be at least 2 characters' },
        { input: phone, validate: v => validatePhone(v), message: 'Enter a valid 10-digit Indian phone number' },
        { input: email, validate: v => validateEmail(v), message: 'Enter a valid email address' },
        { input: password, validate: v => validatePassword(v), message: 'Password must be at least 8 characters' }
      ];
      if (!validateForm(rules)) return;
      if (password.value !== confirmPwd.value) { showFieldError(confirmPwd, 'Passwords do not match'); return; }
      if (!terms.checked) { toast.warning('Please accept the Terms of Service'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Creating account...';
      try {
        await register({ name: name.value, phone: phone.value, email: email.value, password: password.value });
        toast.success('Account created! Redirecting to login...');
        setTimeout(() => { window.location.href = '/login.html'; }, 1000);
      } catch (err) {
        const serverMsg = err.response?.data?.message || err.response?.data?.error || (typeof err.response?.data === 'string' ? err.response.data : null);
        toast.error(serverMsg || err.message || 'Registration failed. Please try again with a different email or phone number.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">person_add</span> Create Account';
      }
    });
  </script>
  <script src="components/toast.js"></script>
</body>
</html>
