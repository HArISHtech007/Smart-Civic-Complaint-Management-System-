<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-visual { background: linear-gradient(135deg, rgba(59,130,246,0.05), rgba(139,92,246,0.05)), var(--bg-primary); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .auth-visual::before { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.08), transparent 70%); top: -100px; right: -100px; animation: blobFloat 15s ease-in-out infinite; }
    .auth-visual::after { content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.06), transparent 70%); bottom: -80px; left: -80px; animation: blobFloat 20s ease-in-out infinite reverse; }
    .auth-form { display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--bg-secondary); }
    .auth-card { width: 100%; max-width: 420px; animation: fadeInUp 0.6s ease; }
    .shaking { animation: shake 0.4s ease; }
    @media (max-width: 768px) { .auth-split { grid-template-columns: 1fr; } .auth-visual { display: none; } }
  </style>
</head>
<body>
  <div class="auth-split">
    <div class="auth-visual">
      <div style="text-align: center; position: relative; z-index: 1;">
        <div style="width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: var(--shadow-glow-blue);">
          <span class="material-symbols-outlined" style="font-size: 40px; color: white;">account_balance</span>
        </div>
        <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 1rem;">Sign in to your Civic Voice account</p>
      </div>
    </div>
    <div class="auth-form">
      <div class="auth-card">
        <div style="margin-bottom: 32px;">
          <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 8px;">Sign In</h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">Enter your credentials to access your dashboard</p>
        </div>
        <form id="loginForm">
          <div class="floating-label-group">
            <input type="email" id="email" class="input" placeholder=" " autocomplete="email">
            <label for="email">Email Address</label>
          </div>
          <div class="floating-label-group">
            <input type="password" id="password" class="input" placeholder=" " autocomplete="current-password">
            <label for="password">Password</label>
            <button type="button" onclick="togglePassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);">
              <span class="material-symbols-outlined" id="eyeIcon" style="font-size: 20px;">visibility_off</span>
            </button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
              <input type="checkbox" style="accent-color: var(--primary-blue);"> Remember me
            </label>
            <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--primary-blue);">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;" id="loginBtn">
            <span class="material-symbols-outlined">login</span>
            Sign In
          </button>
        </form>
        <p style="text-align: center; margin-top: 24px; color: var(--text-tertiary); font-size: 0.85rem;">
          Don't have an account? <a href="register.html" style="color: var(--primary-blue); font-weight: 600;">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api/index.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.textContent = 'visibility'; }
      else { pwd.type = 'password'; icon.textContent = 'visibility_off'; }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Signing in...';
      try {
        const data = await login(email, password);
        toast.success('Welcome back! Redirecting...');
        const userData = data.user || data.data || data;
        const role = (userData?.role || 'citizen').toLowerCase();
        setTimeout(() => { window.location.href = getRedirectUrl(role); }, 500);
      } catch (err) {
        const msg = err.response?.data?.message || err.message || 'Invalid credentials. Please try again.';
        document.querySelector('.auth-card').classList.add('shaking');
        setTimeout(() => document.querySelector('.auth-card').classList.remove('shaking'), 400);
        toast.error(msg);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
      }
    });
  </script>
  <script src="components/toast.js"></script>
</body>
</html>
