<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map View — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; }
    #mapContainer { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; min-height: calc(100vh - var(--topnav-height)); }
    .map-overlay { position: absolute; top: 16px; left: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .map-overlay .card { padding: 12px 16px; min-width: 180px; }
    .legend { position: absolute; bottom: 32px; right: 16px; z-index: 1000; padding: 12px 16px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; padding: 2px 0; color: var(--text-secondary); }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; }
    .complaint-popup { min-width: 240px; }
    .complaint-popup h4 { font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .complaint-popup p { color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 2px; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div id="mapContainer">
        <div id="map"></div>
        <div class="map-overlay">
          <div class="card glass">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="material-symbols-outlined" style="font-size: 18px; color: var(--primary-blue);">filter_alt</span>
              <select id="severityFilter" onchange="loadMapData()" style="background: transparent; border: none; color: var(--text-primary); font-size: 0.85rem; outline: none;">
                <option value="">All Severities</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
          </div>
          <div class="card glass">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="material-symbols-outlined" style="font-size: 18px; color: var(--primary-blue);">category</span>
              <select id="categoryFilter" onchange="loadMapData()" style="background: transparent; border: none; color: var(--text-primary); font-size: 0.85rem; outline: none;">
                <option value="">All Categories</option>
                <option value="Pothole">Pothole</option>
                <option value="Garbage">Garbage</option>
                <option value="Water Leakage">Water Leakage</option>
                <option value="Street Light">Street Light</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card glass legend">
          <p style="font-weight: 600; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-primary);">Severity</p>
          <div class="legend-item"><div class="legend-dot" style="background: #EF4444;"></div> Critical</div>
          <div class="legend-item"><div class="legend-dot" style="background: #F59E0B;"></div> High</div>
          <div class="legend-item"><div class="legend-dot" style="background: #3B82F6;"></div> Medium</div>
          <div class="legend-item"><div class="legend-dot" style="background: #10B981;"></div> Low</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/complaint.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }

    let map = null;
    let markersGroup = null;

    function initMap() {
      if (!map) {
        map = L.map('map', { zoomControl: false }).setView([13.0827, 80.2707], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 19
        }).addTo(map);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
      }
      markersGroup = L.layerGroup().addTo(map);
    }

    function getSeverityColor(severity) {
      const map = { critical: '#EF4444', high: '#F59E0B', medium: '#3B82F6', low: '#10B981' };
      return map[severity?.toLowerCase()] || '#6B7280';
    }

    function getSeverityIcon(severity) {
      const svg = `<svg viewBox="0 0 24 24" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 20h20L12 2z" fill="${getSeverityColor(severity)}" stroke="white" stroke-width="1.5"/>
        <text x="12" y="17" text-anchor="middle" fill="white" font-size="10" font-weight="bold">!</text>
      </svg>`;
      return L.divIcon({ html: svg, className: '', iconSize: [28, 28], iconAnchor: [14, 20] });
    }

    const MOCK_COMPLAINTS = [
      { title: 'Large pothole on Anna Salai', severity: 'critical', category: 'Pothole', lat: 13.0650, lng: 80.2600, location: 'Anna Salai', status: 'assigned' },
      { title: 'Garbage pileup in T Nagar', severity: 'high', category: 'Garbage', lat: 13.0418, lng: 80.2341, location: 'T Nagar', status: 'under_review' },
      { title: 'Water leakage on 2nd Street', severity: 'medium', category: 'Water Leakage', lat: 13.0067, lng: 80.2206, location: 'Velachery', status: 'in_progress' },
      { title: 'Broken street light on Park Road', severity: 'low', category: 'Street Light', lat: 13.0720, lng: 80.2500, location: 'Egmore', status: 'submitted' },
      { title: 'Drainage blockage in Marina', severity: 'critical', category: 'Drainage', lat: 13.0500, lng: 80.2820, location: 'Marina Beach', status: 'assigned' },
      { title: 'Fallen tree on Cathedral Road', severity: 'high', category: 'Tree', lat: 13.0500, lng: 80.2450, location: 'Cathedral Road', status: 'in_progress' },
      { title: 'Road damage in OMR', severity: 'medium', category: 'Pothole', lat: 12.9516, lng: 80.2410, location: 'OMR', status: 'submitted' },
      { title: 'Illegal dumping in Kodambakkam', severity: 'low', category: 'Garbage', lat: 13.0500, lng: 80.2250, location: 'Kodambakkam', status: 'resolved' }
    ];

    async function loadMapData() {
      if (!markersGroup) return;
      markersGroup.clearLayers();
      const severityFilter = document.getElementById('severityFilter').value;
      const categoryFilter = document.getElementById('categoryFilter').value;

      let complaints = [];
      try {
        const params = {};
        if (severityFilter) params.severity = severityFilter;
        if (categoryFilter) params.category = categoryFilter;
        const data = await getAllComplaints(params);
        complaints = data.complaints || data.data || data || [];
      } catch (err) {
        complaints = MOCK_COMPLAINTS;
      }

      let visible = complaints;
      if (severityFilter) visible = visible.filter(c => c.severity === severityFilter);
      if (categoryFilter) visible = visible.filter(c => c.category === categoryFilter);

      visible.forEach(c => {
        const lat = c.lat || (c.location?.coordinates?.[1]);
        const lng = c.lng || (c.location?.coordinates?.[0]);
        if (!lat || !lng) return;
        const marker = L.marker([lat, lng], { icon: getSeverityIcon(c.severity) });
        marker.bindPopup(`
          <div class="complaint-popup">
            <h4>${c.title || 'Complaint'}</h4>
            <p><strong>Category:</strong> ${c.category || 'General'}</p>
            <p><strong>Severity:</strong> ${(c.severity || 'medium').toUpperCase()}</p>
            <p><strong>Status:</strong> ${getStatusConfig(c.status).label}</p>
            <p><strong>Location:</strong> ${c.location?.address || c.location || ''}</p>
          </div>
        `);
        markersGroup.addLayer(marker);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('map');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Map View');
      initMap();
      loadMapData();
    });
  </script>
</body>
</html>
