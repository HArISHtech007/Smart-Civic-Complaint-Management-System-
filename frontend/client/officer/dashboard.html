<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Dashboard — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; }
    .complaint-queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .detail-panel { position: fixed; right: 0; top: 0; width: 480px; height: 100vh; background: var(--bg-secondary); border-left: 1px solid var(--border-subtle); z-index: 200; transform: translateX(100%); transition: transform 0.3s; overflow-y: auto; }
    .detail-panel.open { transform: translateX(0); }
    #officerMap { height: 200px; border-radius: var(--radius-md); }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .detail-panel { width: 100%; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
          <div>
            <h1 style="font-size: 1.5rem; font-weight: 700;">Complaint Queue</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">Assigned complaints for your department</p>
          </div>
          <div style="display: flex; gap: 8px;">
            <select class="input" style="width: auto; padding: 8px 12px;" id="officerFilter">
              <option value="">All Severity</option>
              <option value="critical">Critical</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <div id="officerQueue" class="complaint-queue"></div>
      </div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div style="padding: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h2 style="font-weight: 700; font-size: 1.1rem;">Complaint Details</h2>
          <button onclick="closePanel()" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-tertiary);" onmouseover="this.style.background='rgba(148,163,184,0.1)'" onmouseout="this.style.background='transparent'">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div id="detailContent">
          <div class="skeleton" style="height: 200px; margin-bottom: 16px;"></div>
          <div class="skeleton" style="height: 20px; width: 60%; margin-bottom: 8px;"></div>
          <div class="skeleton" style="height: 16px; width: 40%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/complaint.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }

    async function loadQueue() {
      const container = document.getElementById('officerQueue');
      container.innerHTML = createLoadingSkeleton(4, 'card');
      try {
        const filter = document.getElementById('officerFilter').value;
        const params = { assigned: true };
        if (filter) params.severity = filter;
        const data = await getAllComplaints(params);
        const complaints = data.complaints || data.data || data || [];
        renderQueue(complaints);
      } catch (err) {
        renderMockQueue();
      }
    }

    function renderQueue(complaints) {
      const container = document.getElementById('officerQueue');
      if (!complaints.length) {
        container.innerHTML = '<div class="card" style="padding: 60px; text-align: center; grid-column: 1/-1;"><p style="color: var(--text-tertiary);">No complaints assigned yet.</p></div>';
        return;
      }
      container.innerHTML = complaints.map(c => {
        const severity = getSeverityConfig(c.severity);
        return `<div class="card card-hover" style="padding: 20px; cursor: pointer;" onclick="openDetail('${c._id || c.id}')">
          <div style="display: flex; gap: 12px; margin-bottom: 12px;">
            <div style="width: 60px; height: 60px; border-radius: var(--radius-md); overflow: hidden; flex-shrink: 0; background: var(--bg-secondary);">
              ${c.image ? `<img src="${c.image}" style="width: 100%; height: 100%; object-fit: cover;">` : `<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;"><span class="material-symbols-outlined" style="color: var(--text-muted);">image</span></div>`}
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                <span class="badge" style="background: ${severity.color}20; color: ${severity.color}; font-size: 0.7rem;">${severity.label}</span>
                <span class="badge" style="background: rgba(107,114,128,0.12); color: #6B7280; font-size: 0.7rem;">${c.category || 'General'}</span>
              </div>
              <p style="font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.title || c.description?.substring(0, 50) || 'Complaint'}</p>
              <p style="color: var(--text-tertiary); font-size: 0.8rem;">${c.location?.address || c.location || 'Location N/A'}</p>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-success" style="flex: 1; padding: 8px; font-size: 0.8rem;" onclick="event.stopPropagation();acceptComplaint('${c._id || c.id}')">
              <span class="material-symbols-outlined" style="font-size: 16px;">check</span>
              Accept
            </button>
            <button class="btn btn-secondary" style="flex: 1; padding: 8px; font-size: 0.8rem;" onclick="event.stopPropagation();">
              <span class="material-symbols-outlined" style="font-size: 16px;">close</span>
              Reject
            </button>
          </div>
        </div>`;
      }).join('');
    }

    function renderMockQueue() {
      const mock = [
        { title: 'Pothole on Anna Salai', severity: 'critical', category: 'Pothole', location: 'Anna Salai, Chennai', id: '1' },
        { title: 'Garbage pileup in Ward 12', severity: 'high', category: 'Garbage', location: 'Ward 12, T Nagar', id: '2' },
        { title: 'Water leakage on 2nd Street', severity: 'medium', category: 'Water Leakage', location: '2nd Street, Velachery', id: '3' },
        { title: 'Street light not working', severity: 'low', category: 'Lighting', location: 'Park Road, Egmore', id: '4' }
      ];
      renderQueue(mock);
    }

    function openDetail(id) { document.getElementById('detailPanel').classList.add('open'); }

    function closePanel() { document.getElementById('detailPanel').classList.remove('open'); }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Complaint Queue');
      loadQueue();
    });
  </script>
</body>
</html>
