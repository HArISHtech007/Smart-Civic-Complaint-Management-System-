<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Officers — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; background-color: var(--bg-primary); }
    .main-content { margin-left: var(--sidebar-width); flex: 1; min-width: 0; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 14px 16px; font-size: 0.8rem; color: var(--text-tertiary); font-weight: 700; border-bottom: 1px solid var(--border-subtle); text-transform: uppercase; letter-spacing: 0.05em; }
    .data-table td { padding: 14px 16px; font-size: 0.85rem; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .data-table tr:hover td { background: rgba(148,163,184,0.03); }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .table-wrap { overflow-x: auto; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px; max-width: 1400px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
          <div>
            <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">Department Officers</h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 2px;">Manage field officers and staff assigned to your department.</p>
          </div>
          <button class="btn btn-primary" onclick="showAddOfficerModal()" style="display: flex; align-items: center; gap: 8px;">
            <span class="material-symbols-outlined" style="font-size: 18px;">person_add</span> Add Officer
          </button>
        </div>

        <div class="card" style="overflow: hidden; border: 1px solid var(--border-subtle);">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Officer Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Role</th>
                  <th>Department</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="officersTableBody">
                <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-tertiary);">Loading department officers...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/department.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }

    function getCustomUsers() {
      return JSON.parse(localStorage.getItem('civic_custom_users') || '[]');
    }

    function saveCustomUsers(users) {
      localStorage.setItem('civic_custom_users', JSON.stringify(users));
    }

    const defaultMockOfficers = [
      { _id: '65fb7bb360d8e20f381e5b82', name: 'Officer Bob', email: 'officer@example.com', phone: '5555555555', role: 'officer', department: 'Roads & Highways' },
      { _id: '65fb7bb360d8e20f381e5b85', name: 'Carol Head', email: 'carol@example.com', phone: '9876543212', role: 'head_officer', department: 'Solid Waste Management' }
    ];

    function loadDepartmentOfficers() {
      const tbody = document.getElementById('officersTableBody');
      const currentHead = getUser() || {};
      const headDept = currentHead.department || 'Roads & Highways';

      const custom = getCustomUsers();
      const merged = [...defaultMockOfficers, ...custom];
      
      const filtered = merged.filter(u => {
        const r = (u.role || '').toLowerCase();
        return r.includes('officer');
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-tertiary);">No officers found for this department. Click "Add Officer" to add field officers.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(u => `
        <tr>
          <td><strong style="color: var(--text-primary); font-weight: 700;">${u.name}</strong></td>
          <td>${u.email}</td>
          <td>${u.phone || 'N/A'}</td>
          <td><span class="badge" style="background: rgba(59,130,246,0.15); color: var(--primary-blue); border-radius: 20px; padding: 4px 10px; font-size: 0.75rem; text-transform: uppercase;">${u.role || 'Officer'}</span></td>
          <td>${u.department || headDept}</td>
          <td><span style="color: var(--success-green); font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 4px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--success-green);"></span> Active</span></td>
        </tr>
      `).join('');
    }

    function showAddOfficerModal() {
      const currentHead = getUser() || {};
      const headDept = currentHead.department || 'Roads & Highways';

      renderModal({
        title: 'Add Field Officer',
        content: `
          <div style="display: flex; flex-direction: column; gap: 14px;">
            <div class="floating-label-group"><input type="text" id="offName" class="input" placeholder=" "><label>Full Name</label></div>
            <div class="floating-label-group"><input type="email" id="offEmail" class="input" placeholder=" "><label>Email Address</label></div>
            <div class="floating-label-group"><input type="tel" id="offPhone" class="input" placeholder=" "><label>Phone Number</label></div>
            <div class="floating-label-group"><input type="password" id="offPass" class="input" placeholder=" "><label>Initial Password</label></div>
            <div class="floating-label-group">
              <input type="text" id="offDept" class="input" value="${headDept}" readonly style="background: var(--bg-secondary); cursor: not-allowed;">
              <label style="transform: translateY(-22px) scale(0.85); color: var(--primary-blue);">Department (Assigned)</label>
            </div>
          </div>`,
        confirmText: 'Create Officer',
        onConfirm: async (close) => {
          const name = document.getElementById('offName')?.value?.trim();
          const email = document.getElementById('offEmail')?.value?.trim();
          const phone = document.getElementById('offPhone')?.value?.trim();
          const pass = document.getElementById('offPass')?.value?.trim();

          if (!name || !email) { toast.error('Please enter name and email'); return; }

          const custom = getCustomUsers();
          custom.push({
            _id: 'off-' + Date.now(),
            name, email, phone, password: pass || 'password123',
            role: 'officer',
            department: headDept
          });
          saveCustomUsers(custom);

          toast.success(`Officer "${name}" added successfully!`);
          close();
          loadDepartmentOfficers();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('officers');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Department Officers');
      loadDepartmentOfficers();
    });
  </script>
</body>
</html>
