<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Complaints — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; background-color: var(--bg-primary); }
    .main-content { margin-left: var(--sidebar-width); flex: 1; min-width: 0; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 14px 16px; font-size: 0.8rem; color: var(--text-tertiary); font-weight: 700; border-bottom: 1px solid var(--border-subtle); text-transform: uppercase; letter-spacing: 0.05em; }
    .data-table td { padding: 14px 16px; font-size: 0.85rem; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .data-table tr:hover td { background: rgba(148,163,184,0.03); }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .table-wrap { overflow-x: auto; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px; max-width: 1400px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
          <div>
            <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">Department Complaints</h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 2px;">Review and manage active issues assigned to your department.</p>
          </div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <input type="text" class="input" placeholder="Search complaints..." style="width: 220px; padding: 10px 14px; font-size: 0.85rem;" id="searchInput" oninput="applyFilters()">
            <select class="input" style="width: auto; padding: 10px 14px; font-size: 0.85rem;" id="filterStatus" onchange="applyFilters()">
              <option value="">All Status</option>
              <option value="submitted">Submitted / Pending</option>
              <option value="in_progress">In Progress</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>
        </div>

        <div class="card" style="overflow: hidden; border: 1px solid var(--border-subtle);">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Tracking ID</th>
                  <th>Issue Details</th>
                  <th>Category</th>
                  <th>Severity</th>
                  <th>Status</th>
                  <th>Reported Date</th>
                  <th style="text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody id="complaintTableBody">
                <tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">Loading department complaints...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/complaint.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }
    let rawComplaints = [];

    function isSameDepartment(officerDept, complaintDept) {
      if (!officerDept || officerDept === '' || officerDept.toLowerCase().includes('general')) return true;
      const o = officerDept.toLowerCase().trim();
      const c = (complaintDept || '').toLowerCase().trim();

      if (o.includes('road') && (c.includes('road') || c.includes('pothole'))) return true;
      if ((o.includes('waste') || o.includes('sanitat')) && (c.includes('waste') || c.includes('sanitat') || c.includes('garbage'))) return true;
      if ((o.includes('water') || o.includes('drain')) && (c.includes('water') || c.includes('drain') || c.includes('leak'))) return true;
      if ((o.includes('light') || o.includes('electric')) && (c.includes('light') || c.includes('electric') || c.includes('lamp'))) return true;
      if ((o.includes('tree') || o.includes('park')) && (c.includes('tree') || c.includes('park'))) return true;
      if ((o.includes('town') || o.includes('plan')) && (c.includes('town') || c.includes('plan'))) return true;

      return o.includes(c) || c.includes(o);
    }

    async function loadHeadComplaints() {
      const tbody = document.getElementById('complaintTableBody');
      try {
        const data = await getAllComplaints();
        const list = data.complaints || data.data || (Array.isArray(data) ? data : []);
        const user = getUser() || {};
        const officerDept = user.department || localStorage.getItem('civic_officer_dept') || '';

        rawComplaints = list.filter(c => isSameDepartment(officerDept, c.department));
        renderComplaints(rawComplaints);
      } catch (err) {
        console.error('Error loading complaints:', err);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger-red); padding: 30px;">Failed to load department complaints.</td></tr>`;
      }
    }

    function renderComplaints(list) {
      const tbody = document.getElementById('complaintTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-tertiary);">No complaints found for your department.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(c => {
        const id = c._id || c.trackingId || c.id || 'CIV-0000';
        const title = c.title || 'Civic Complaint';
        const desc = c.description || 'No description provided.';
        const category = c.category || 'General';
        const severity = (c.severity || 'medium').toLowerCase();
        const status = (c.status || 'submitted').toLowerCase();
        const date = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : 'Recent';

        let badgeBg = 'rgba(107, 114, 128, 0.15)';
        let badgeColor = '#9CA3AF';
        let statusText = status.toUpperCase();

        if (status === 'resolved' || status === 'completed') {
          badgeBg = 'rgba(16, 185, 129, 0.15)';
          badgeColor = 'var(--success-green)';
          statusText = 'RESOLVED';
        } else if (status === 'in_progress') {
          badgeBg = 'rgba(139, 92, 246, 0.15)';
          badgeColor = 'var(--primary-purple)';
          statusText = 'IN PROGRESS';
        } else {
          badgeBg = 'rgba(245, 158, 11, 0.15)';
          badgeColor = 'var(--warning-amber)';
          statusText = 'PENDING';
        }

        return `
          <tr>
            <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 600; color: var(--primary-blue);">${id}</td>
            <td>
              <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 2px;">${title}</div>
              <div style="color: var(--text-tertiary); font-size: 0.78rem; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${desc}</div>
            </td>
            <td><span class="badge" style="background: rgba(59, 130, 246, 0.1); color: var(--primary-blue); border-radius: 6px; padding: 4px 8px; font-size: 0.75rem;">${category}</span></td>
            <td><span class="badge severity-${severity}" style="text-transform: capitalize; border-radius: 6px; padding: 4px 8px; font-size: 0.75rem;">${severity}</span></td>
            <td><span class="badge" style="background: ${badgeBg}; color: ${badgeColor}; border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; font-weight: 700;">${statusText}</span></td>
            <td style="color: var(--text-secondary); font-size: 0.8rem;">${date}</td>
            <td style="text-align: right;">
              <button onclick="window.location.href='/head-officer/dashboard.html?id=${id}'" class="btn btn-sm" style="background: rgba(59, 130, 246, 0.1); color: var(--primary-blue); border-radius: 6px; font-size: 0.78rem; padding: 6px 12px; border: none; font-weight: 600; cursor: pointer;">
                View Details
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const statusFilter = (document.getElementById('filterStatus')?.value || '').toLowerCase();

      const filtered = rawComplaints.filter(c => {
        const title = (c.title || '').toLowerCase();
        const desc = (c.description || '').toLowerCase();
        const id = (c._id || c.trackingId || '').toLowerCase();
        const matchesSearch = !q || title.includes(q) || desc.includes(q) || id.includes(q);

        const status = (c.status || 'submitted').toLowerCase();
        let matchesStatus = true;
        if (statusFilter === 'submitted') matchesStatus = status === 'submitted' || status === 'pending';
        else if (statusFilter === 'in_progress') matchesStatus = status === 'in_progress';
        else if (statusFilter === 'resolved') matchesStatus = status === 'resolved' || status === 'completed';

        return matchesSearch && matchesStatus;
      });

      renderComplaints(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('complaints');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Department Complaints');
      loadHeadComplaints();
    });
  </script>
</body>
</html>
