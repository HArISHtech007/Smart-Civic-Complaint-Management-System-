<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Head Officer Dashboard — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; }
    .officer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px;">
        <div style="margin-bottom: 32px;">
          <h1 style="font-size: 1.5rem; font-weight: 700;">Department Overview</h1>
          <p style="color: var(--text-secondary); margin-top: 4px;">Roads & Highways Department</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px;">
          <div class="card" style="padding: 24px;"><p style="color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 8px;">Total Assigned</p><p style="font-size: 1.75rem; font-weight: 800;">24</p></div>
          <div class="card" style="padding: 24px;"><p style="color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 8px;">In Progress</p><p style="font-size: 1.75rem; font-weight: 800; color: var(--primary-purple);">12</p></div>
          <div class="card" style="padding: 24px;"><p style="color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 8px;">Resolved</p><p style="font-size: 1.75rem; font-weight: 800; color: var(--success-green);">8</p></div>
          <div class="card" style="padding: 24px;"><p style="color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 8px;">Pending</p><p style="font-size: 1.75rem; font-weight: 800; color: var(--warning-amber);">4</p></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="font-size: 1.1rem; font-weight: 600;">Department Officers</h2>
          <button class="btn btn-primary" onclick="showAddOfficerModal()"><span class="material-symbols-outlined">person_add</span> Add Officer</button>
        </div>

        <div class="officer-grid" id="officerGrid">
          <div class="card" style="padding: 20px;"><div class="skeleton" style="height: 48px; width: 48px; border-radius: 50%; margin-bottom: 12px;"></div><div class="skeleton" style="height: 16px; width: 60%;"></div></div>
          <div class="card" style="padding: 20px;"><div class="skeleton" style="height: 48px; width: 48px; border-radius: 50%; margin-bottom: 12px;"></div><div class="skeleton" style="height: 16px; width: 60%;"></div></div>
          <div class="card" style="padding: 20px;"><div class="skeleton" style="height: 48px; width: 48px; border-radius: 50%; margin-bottom: 12px;"></div><div class="skeleton" style="height: 16px; width: 60%;"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }

    async function loadOfficers() {
      const container = document.getElementById('officerGrid');
      try {
        const data = await getUsers({ role: 'officer', department: 'roads' });
        const users = data.users || data.data || data || [];
        container.innerHTML = users.length ? users.map(u => `
          <div class="card card-hover" style="padding: 20px; text-align: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 1.1rem; margin: 0 auto 12px;">${u.name?.charAt(0) || 'O'}</div>
            <p style="font-weight: 600; font-size: 0.95rem;">${u.name || 'Officer'}</p>
            <p style="color: var(--text-tertiary); font-size: 0.8rem;">${u.email || ''}</p>
            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 12px;">
              <span class="badge" style="background: rgba(16,185,129,0.12); color: #10B981;">${u.resolvedCount || 0} Resolved</span>
              <span class="badge" style="background: rgba(59,130,246,0.12); color: #3B82F6;">${u.assignedCount || 0} Active</span>
            </div>
          </div>
        `).join('') : '<div class="card" style="padding: 40px; text-align: center; grid-column: 1/-1;"><p style="color: var(--text-tertiary);">No officers in this department yet.</p></div>';
      } catch (err) {
        container.innerHTML = Array(3).fill(0).map((_, i) => `
          <div class="card card-hover" style="padding: 20px; text-align: center;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 1.1rem; margin: 0 auto 12px;">${['A', 'B', 'C'][i]}</div>
            <p style="font-weight: 600; font-size: 0.95rem;">Officer ${['Alpha', 'Bravo', 'Charlie'][i]}</p>
            <p style="color: var(--text-tertiary); font-size: 0.8rem;">officer${i+1}@civicvoice.in</p>
            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 12px;">
              <span class="badge" style="background: rgba(16,185,129,0.12); color: #10B981;">${[15, 22, 8][i]} Resolved</span>
              <span class="badge" style="background: rgba(59,130,246,0.12); color: #3B82F6;">${[3, 5, 2][i]} Active</span>
            </div>
          </div>
        `).join('');
      }
    }

    function showAddOfficerModal() {
      renderModal({
        title: 'Add Officer',
        content: `<div class="floating-label-group"><input type="email" id="officerEmail" class="input" placeholder=" "><label>Officer Email</label></div>
        <div class="floating-label-group"><input type="text" id="officerName" class="input" placeholder=" "><label>Officer Name</label></div>`,
        confirmText: 'Add Officer',
        onConfirm: async (close) => {
          toast.success('Officer added successfully');
          close();
          loadOfficers();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Department Overview');
      loadOfficers();
    });
  </script>
</body>
</html>
