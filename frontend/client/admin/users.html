<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users Management — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--bg-card); padding: 4px; border-radius: var(--radius-md); width: fit-content; }
    .tab { padding: 8px 20px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; color: var(--text-tertiary); cursor: pointer; transition: all 0.2s; }
    .tab.active { background: var(--primary-blue); color: white; }
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h1 style="font-size: 1.5rem; font-weight: 700;">Users Management</h1>
          <button class="btn btn-primary" onclick="showAddUserModal()"><span class="material-symbols-outlined">person_add</span> Add User</button>
        </div>
        <div class="tabs" id="userTabs">
          <div class="tab active" data-role="citizen" onclick="switchTab('citizen')">Citizens</div>
          <div class="tab" data-role="officer" onclick="switchTab('officer')">Officers</div>
          <div class="tab" data-role="head_officer" onclick="switchTab('head_officer')">Head Officers</div>
          <div class="tab" data-role="admin" onclick="switchTab('admin')">Admins</div>
        </div>
        <div class="user-grid" id="userGrid">
          <div class="card" style="padding: 24px;"><div class="skeleton" style="height: 48px; width: 48px; border-radius: 50%; margin-bottom: 12px;"></div><div class="skeleton" style="height: 16px; width: 60%;"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/user.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }
    let currentRole = 'citizen';

    function switchTab(role) {
      currentRole = role;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
      loadUsers();
    }

    async function loadUsers() {
      const grid = document.getElementById('userGrid');
      grid.innerHTML = createLoadingSkeleton(4, 'card');
      try {
        const data = await getUsers({ role: currentRole });
        const users = data.users || data.data || data || [];
        grid.innerHTML = users.length ? users.map(u => `
          <div class="card card-hover" style="padding: 20px; display: flex; align-items: center; gap: 16px;">
            <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; flex-shrink: 0;">${u.name?.charAt(0) || 'U'}</div>
            <div style="flex: 1; min-width: 0;">
              <p style="font-weight: 600; font-size: 0.9rem;">${u.name || 'User'}</p>
              <p style="color: var(--text-tertiary); font-size: 0.8rem;">${u.email || ''}</p>
              ${u.phone ? `<p style="color: var(--text-muted); font-size: 0.75rem;">${u.phone}</p>` : ''}
            </div>
            <div style="display: flex; gap: 4px;">
              <button class="btn btn-ghost" style="padding: 4px;" onclick="toast.info('Edit user')"><span class="material-symbols-outlined" style="font-size: 18px;">edit</span></button>
              <button class="btn btn-ghost" style="padding: 4px; color: var(--danger-red);" onclick="showConfirmDialog('Delete ${u.name}?', ()=>{toast.success('Deleted'); loadUsers();})"><span class="material-symbols-outlined" style="font-size: 18px;">delete</span></button>
            </div>
          </div>
        `).join('') : '<div class="card" style="padding: 40px; text-align: center; grid-column: 1/-1;"><p style="color: var(--text-tertiary);">No users found.</p></div>';
      } catch (err) {
        grid.innerHTML = Array(4).fill(0).map((_, i) => `
          <div class="card card-hover" style="padding: 20px; display: flex; align-items: center; gap: 16px;">
            <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">${['A','B','C','D'][i]}</div>
            <div style="flex: 1;">
              <p style="font-weight: 600; font-size: 0.9rem;">User ${i + 1}</p>
              <p style="color: var(--text-tertiary); font-size: 0.8rem;">user${i+1}@example.com</p>
            </div>
            <div style="display: flex; gap: 4px;">
              <button class="btn btn-ghost" style="padding: 4px;"><span class="material-symbols-outlined" style="font-size: 18px;">edit</span></button>
              <button class="btn btn-ghost" style="padding: 4px; color: var(--danger-red);"><span class="material-symbols-outlined" style="font-size: 18px;">delete</span></button>
            </div>
          </div>
        `).join('');
      }
    }

    function showAddUserModal() {
      renderModal({
        title: 'Add User',
        content: `<div class="floating-label-group"><input type="text" id="newName" class="input" placeholder=" "><label>Full Name</label></div>
        <div class="floating-label-group"><input type="email" id="newEmail" class="input" placeholder=" "><label>Email</label></div>
        <div class="floating-label-group"><input type="tel" id="newPhone" class="input" placeholder=" "><label>Phone</label></div>
        <div class="floating-label-group"><input type="password" id="newPwd" class="input" placeholder=" "><label>Password</label></div>`,
        confirmText: 'Create User',
        onConfirm: async (close) => {
          toast.success('User created successfully');
          close();
          loadUsers();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('users');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Users Management');
      loadUsers();
    });
  </script>
</body>
</html>
