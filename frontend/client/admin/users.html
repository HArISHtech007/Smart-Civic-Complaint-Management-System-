<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users Management — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; background-color: var(--bg-primary); }
    .main-content { margin-left: var(--sidebar-width); flex: 1; min-width: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 24px; background: var(--bg-secondary); padding: 6px; border-radius: var(--radius-lg); width: fit-content; border: 1px solid var(--border-subtle); }
    .tab { padding: 10px 22px; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 600; color: var(--text-tertiary); cursor: pointer; transition: all 0.2s; user-select: none; }
    .tab:hover { color: var(--text-primary); }
    .tab.active { background: var(--primary-blue); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    
    .user-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
    }
    .user-card:hover {
      transform: translateY(-2px);
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.3);
    }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .tabs { width: 100%; overflow-x: auto; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>

      <div style="padding: 32px; max-width: 1300px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
          <div>
            <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em;">Users Management</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">Manage accounts, credentials, and access roles across the platform.</p>
          </div>
          <button class="btn btn-primary" onclick="showAddUserModal()" style="padding: 12px 20px; font-weight: 600;">
            <span class="material-symbols-outlined" style="font-size: 20px;">person_add</span> Add New User
          </button>
        </div>

        <!-- Role Tabs -->
        <div class="tabs" id="userTabs">
          <div class="tab active" data-role="citizen" onclick="switchTab('citizen')">Citizens</div>
          <div class="tab" data-role="officer" onclick="switchTab('officer')">Field Officers</div>
          <div class="tab" data-role="head_officer" onclick="switchTab('head_officer')">Head Officers</div>
          <div class="tab" data-role="admin" onclick="switchTab('admin')">Admins</div>
        </div>

        <!-- Users Grid -->
        <div class="user-grid" id="userGrid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/user.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/utils.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }
    let currentRole = 'citizen';

    function switchTab(role) {
      currentRole = role;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
      loadUsers();
    }

    async function loadUsers() {
      const grid = document.getElementById('userGrid');
      grid.innerHTML = (typeof createLoadingSkeleton === 'function') ? 
        createLoadingSkeleton(4, 'card') : 
        `<div class="card" style="grid-column: 1/-1; padding: 40px; text-align: center;"><div class="spinner" style="margin: 0 auto 12px auto;"></div><p style="color: var(--text-tertiary);">Loading user records...</p></div>`;

      try {
        const data = await getUsers({ role: currentRole });
        const users = data.users || data.data || (Array.isArray(data) ? data : []);

        if (!users.length) {
          grid.innerHTML = `
            <div class="card" style="padding: 48px 20px; text-align: center; grid-column: 1/-1;">
              <span class="material-symbols-outlined" style="font-size: 40px; color: var(--text-tertiary); margin-bottom: 12px;">person_off</span>
              <h3 style="font-weight: 700; font-size: 1.1rem; margin-bottom: 6px;">No ${currentRole.replace('_', ' ')}s found</h3>
              <p style="color: var(--text-tertiary); font-size: 0.88rem; margin-bottom: 16px;">There are currently no registered users registered under this role.</p>
              <button class="btn btn-secondary" onclick="showAddUserModal()">+ Add ${currentRole.replace('_', ' ')}</button>
            </div>`;
          return;
        }

        grid.innerHTML = users.map(u => {
          const initials = (u.name || 'User').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
          const deptTag = u.department ? `<span class="badge" style="background: rgba(59,130,246,0.1); color: var(--primary-blue); font-size: 0.72rem; margin-top: 4px;">${u.department}</span>` : '';

          return `
            <div class="user-card">
              <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1rem; flex-shrink: 0; box-shadow: 0 4px 10px rgba(59,130,246,0.25);">
                ${initials}
              </div>
              <div style="flex: 1; min-width: 0;">
                <h3 style="font-weight: 700; font-size: 0.98rem; color: var(--text-primary); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${u.name || 'User Account'}</h3>
                <p style="color: var(--text-tertiary); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${u.email || ''}</p>
                ${u.phone ? `<p style="color: var(--text-muted); font-size: 0.76rem; margin-top: 2px; display: flex; align-items: center; gap: 4px;"><span class="material-symbols-outlined" style="font-size: 13px;">call</span> ${u.phone}</p>` : ''}
                ${deptTag}
              </div>
              <div style="display: flex; gap: 4px;">
                <button class="btn btn-ghost" style="padding: 6px; color: var(--text-secondary);" title="Edit User" onclick="toast.info('Edit ${u.name}')"><span class="material-symbols-outlined" style="font-size: 18px;">edit</span></button>
                <button class="btn btn-ghost" style="padding: 6px; color: var(--danger-red);" title="Delete User" onclick="deleteUserHandler('${u._id}', '${u.name}')"><span class="material-symbols-outlined" style="font-size: 18px;">delete</span></button>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error('Users load error:', err);
        grid.innerHTML = `<div class="card" style="padding: 40px; text-align: center; grid-column: 1/-1;"><p style="color: var(--danger-red);">Failed to load user list. Please refresh.</p></div>`;
      }
    }

    async function deleteUserHandler(id, name) {
      showConfirmDialog(`Are you sure you want to remove user "${name}"?`, async () => {
        await deleteUser(id);
        toast.success(`User "${name}" removed successfully`);
        loadUsers();
      });
    }

    function showAddUserModal() {
      renderModal({
        title: 'Add New User Account',
        content: `
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div class="floating-label-group"><input type="text" id="newName" class="input" placeholder=" "><label>Full Name</label></div>
            <div class="floating-label-group"><input type="email" id="newEmail" class="input" placeholder=" "><label>Email Address</label></div>
            <div class="floating-label-group"><input type="tel" id="newPhone" class="input" placeholder=" "><label>Phone Number</label></div>
            <div class="floating-label-group"><input type="password" id="newPwd" class="input" placeholder=" "><label>Password</label></div>
            <div>
              <label style="font-size: 0.8rem; color: var(--text-tertiary); display: block; margin-bottom: 6px;">Role</label>
              <select id="newRole" class="input" style="width: 100%;">
                <option value="citizen" ${currentRole === 'citizen' ? 'selected' : ''}>Citizen</option>
                <option value="officer" ${currentRole === 'officer' ? 'selected' : ''}>Field Officer</option>
                <option value="head_officer" ${currentRole === 'head_officer' ? 'selected' : ''}>Head Officer</option>
                <option value="admin" ${currentRole === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
            </div>
          </div>`,
        confirmText: 'Create User',
        onConfirm: async (close) => {
          const name = document.getElementById('newName').value;
          const email = document.getElementById('newEmail').value;
          const phone = document.getElementById('newPhone').value;
          const password = document.getElementById('newPwd').value;
          const role = document.getElementById('newRole').value;

          if (!name || !email) {
            toast.error('Please enter name and email');
            return;
          }

          await createUser({ name, email, phone, password, role });
          toast.success(`User ${name} created!`);
          close();
          loadUsers();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('users');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Users Management');
      loadUsers();
    });
  </script>
</body>
</html>
