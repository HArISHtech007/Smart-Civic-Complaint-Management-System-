<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Complaints — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .dashboard-layout { display: flex; min-height: 100vh; }
    .main-content { margin-left: var(--sidebar-width); flex: 1; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: 12px 16px; font-size: 0.8rem; color: var(--text-tertiary); font-weight: 600; border-bottom: 1px solid var(--border-subtle); }
    .data-table td { padding: 14px 16px; font-size: 0.85rem; border-bottom: 1px solid var(--border-subtle); }
    .data-table tr:hover td { background: rgba(148,163,184,0.03); }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .table-wrap { overflow-x: auto; } }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="topnavContainer"></div>
      <div style="padding: 32px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
          <h1 style="font-size: 1.5rem; font-weight: 700;">Complaints Management</h1>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input type="text" class="input" placeholder="Search complaints..." style="width: 200px; padding: 8px 12px;" id="searchInput">
            <select class="input" style="width: auto; padding: 8px 12px;" id="filterDept"><option value="">All Departments</option><option>Roads & Highways</option><option>Waste Management</option><option>Water Supply</option><option>Street Lighting</option></select>
            <select class="input" style="width: auto; padding: 8px 12px;" id="filterStatus"><option value="">All Status</option><option>submitted</option><option>under_review</option><option>assigned</option><option>in_progress</option><option>resolved</option></select>
            <button class="btn btn-secondary"><span class="material-symbols-outlined">download</span> Export CSV</button>
          </div>
        </div>
        <div class="card" style="overflow: hidden;">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr>
                <th>ID</th><th>Issue</th><th>Category</th><th>Severity</th><th>Status</th><th>Department</th><th>Date</th><th>Actions</th>
              </tr></thead>
              <tbody id="complaintTableBody">
                <tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-tertiary);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/api/index.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/services/complaint.service.js"></script>
  <script src="../js/utils/constants.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/toast.js"></script>
  <script>
    if (!requireAuth()) { window.location.href = '/login.html'; }

    async function loadComplaints() {
      const tbody = document.getElementById('complaintTableBody');
      try {
        const data = await getAllComplaints();
        const complaints = data.complaints || data.data || data || [];
        if (!complaints.length) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-tertiary);">No complaints found.</td></tr>';
          return;
        }
        tbody.innerHTML = complaints.map(c => {
          const sev = getSeverityConfig(c.severity);
          const stat = getStatusConfig(c.status);
          return `<tr>
            <td class="mono" style="color: var(--text-tertiary);">${(c._id || c.id || '').substring(0, 8)}...</td>
            <td style="font-weight: 500;">${c.title || 'Complaint'}</td>
            <td><span class="badge" style="background: rgba(107,114,128,0.12); color: #6B7280;">${c.category || 'General'}</span></td>
            <td><span class="badge" style="background: ${sev.color}20; color: ${sev.color};">${sev.label}</span></td>
            <td><span class="badge" style="background: ${stat.color}20; color: ${stat.color};">${stat.label}</span></td>
            <td style="color: var(--text-secondary);">${c.department || '--'}</td>
            <td style="color: var(--text-tertiary); font-size: 0.8rem;">${formatDate(c.createdAt)}</td>
            <td>
              <button class="btn btn-ghost" style="padding: 4px 8px;" onclick="toast.info('Assign feature')"><span class="material-symbols-outlined" style="font-size: 18px;">assignment</span></button>
              <button class="btn btn-ghost" style="padding: 4px 8px; color: var(--danger-red);" onclick="showConfirmDialog('Delete this complaint?', ()=>toast.success('Deleted'))"><span class="material-symbols-outlined" style="font-size: 18px;">delete</span></button>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-tertiary);">Failed to load. Make sure backend is running.</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      document.getElementById('sidebarContainer').innerHTML = renderSidebar('complaints');
      document.getElementById('topnavContainer').innerHTML = renderTopNav('Complaints Management');
      loadComplaints();
    });
  </script>
</body>
</html>
