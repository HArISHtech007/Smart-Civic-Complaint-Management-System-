<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Civic Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); transition: all 0.3s; }
    .step-dot.active { background: var(--primary-blue); box-shadow: 0 0 8px var(--blue-glow); }
    .step-dot.completed { background: var(--success-green); }
    .otp-input { width: 48px; height: 56px; text-align: center; font-size: 1.25rem; font-weight: 600; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-card); color: var(--text-primary); outline: none; }
    .otp-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px var(--blue-glow); }
    .success-check { width: 64px; height: 64px; border-radius: 50%; background: rgba(16,185,129,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .success-check svg { width: 36px; height: 36px; }
  </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 40px; animation: fadeInUp 0.5s ease;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple)); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: var(--shadow-glow-blue);">
        <span class="material-symbols-outlined" style="font-size: 28px; color: white;">lock_reset</span>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">Reset Password</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">We'll send you an OTP to reset your password</p>
    </div>
    <div class="step-indicator">
      <div class="step-dot active" id="step1"></div>
      <div class="step-dot" id="step2"></div>
      <div class="step-dot" id="step3"></div>
    </div>

    <div id="stepEmail">
      <div class="floating-label-group">
        <input type="email" id="resetEmail" class="input" placeholder=" " autocomplete="email">
        <label for="resetEmail">Email Address</label>
      </div>
      <button class="btn btn-primary" style="width: 100%; padding: 14px;" onclick="sendOtp()">
        <span class="material-symbols-outlined">send</span>
        Send OTP
      </button>
    </div>

    <div id="stepOtp" style="display: none;">
      <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 20px; text-align: center;">Enter the 6-digit OTP sent to your email</p>
      <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;">
        <input class="otp-input" maxlength="1" oninput="moveNext(this, 'otp2')" id="otp1">
        <input class="otp-input" maxlength="1" oninput="moveNext(this, 'otp3')" id="otp2">
        <input class="otp-input" maxlength="1" oninput="moveNext(this, 'otp4')" id="otp3">
        <input class="otp-input" maxlength="1" oninput="moveNext(this, 'otp5')" id="otp4">
        <input class="otp-input" maxlength="1" oninput="moveNext(this, 'otp6')" id="otp5">
        <input class="otp-input" maxlength="1" oninput="moveNext(this, null)" id="otp6">
      </div>
      <button class="btn btn-primary" style="width: 100%; padding: 14px;" onclick="verifyOtp()">
        <span class="material-symbols-outlined">verified</span>
        Verify OTP
      </button>
    </div>

    <div id="stepNewPassword" style="display: none;">
      <div class="floating-label-group">
        <input type="password" id="newPassword" class="input" placeholder=" ">
        <label for="newPassword">New Password</label>
      </div>
      <div class="floating-label-group">
        <input type="password" id="confirmNewPassword" class="input" placeholder=" ">
        <label for="confirmNewPassword">Confirm Password</label>
      </div>
      <button class="btn btn-primary" style="width: 100%; padding: 14px;" onclick="resetPassword()">
        <span class="material-symbols-outlined">check_circle</span>
        Reset Password
      </button>
    </div>

    <div id="stepSuccess" style="display: none; text-align: center;">
      <div class="success-check">
        <svg viewBox="0 0 36 36"><path class="checkmark-path" d="M6 18 L15 27 L30 10" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">Password Reset!</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px;">Your password has been successfully updated.</p>
      <a href="login.html" class="btn btn-primary" style="padding: 14px 32px;">
        <span class="material-symbols-outlined">login</span>
        Back to Login
      </a>
    </div>

    <p style="text-align: center; margin-top: 24px;">
      <a href="login.html" style="color: var(--text-tertiary); font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
        Back to Login
      </a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api/index.js"></script>
  <script src="components/toast.js"></script>
  <script>
    function moveNext(input, nextId) {
      if (input.value.length >= 1 && nextId) document.getElementById(nextId).focus();
    }
    function updateStep(step) {
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById('step' + i);
        dot.classList.remove('active', 'completed');
        if (i < step) dot.classList.add('completed');
        else if (i === step) dot.classList.add('active');
      }
    }
    function showStep(step) {
      document.getElementById('stepEmail').style.display = step === 1 ? 'block' : 'none';
      document.getElementById('stepOtp').style.display = step === 2 ? 'block' : 'none';
      document.getElementById('stepNewPassword').style.display = step === 3 ? 'block' : 'none';
      document.getElementById('stepSuccess').style.display = 'none';
      updateStep(step);
    }
    async function sendOtp() {
      const email = document.getElementById('resetEmail').value;
      if (!validateEmail(email)) { toast.error('Please enter a valid email'); return; }
      try {
        await api.post('/auth/forgot-password', { email });
        toast.success('OTP sent to your email');
        showStep(2);
      } catch (err) { toast.error(err.response?.data?.message || 'Failed to send OTP'); }
    }
    async function verifyOtp() {
      const otp = [1,2,3,4,5,6].map(i => document.getElementById('otp' + i).value).join('');
      if (otp.length < 6) { toast.error('Please enter the complete OTP'); return; }
      try {
        await api.post('/auth/verify-otp', { email: document.getElementById('resetEmail').value, otp });
        toast.success('OTP verified');
        showStep(3);
      } catch (err) { toast.error('Invalid or expired OTP'); }
    }
    async function resetPassword() {
      const pwd = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNewPassword').value;
      if (pwd.length < 8) { toast.error('Password must be at least 8 characters'); return; }
      if (pwd !== confirm) { toast.error('Passwords do not match'); return; }
      try {
        await api.post('/auth/reset-password', { email: document.getElementById('resetEmail').value, password: pwd });
        document.getElementById('stepNewPassword').style.display = 'none';
        document.getElementById('stepSuccess').style.display = 'block';
        updateStep(4);
      } catch (err) { toast.error('Failed to reset password'); }
    }
  </script>
</body>
</html>
